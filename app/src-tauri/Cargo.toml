[package]
name = "conductor-app"
version.workspace = true
edition = "2024"
description = "Control your PCs from your other devices over Tailscale"

[lib]
name = "conductor_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
conductor-proto = { path = "../../crates/proto" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.4", features = [] }
tokio = { version = "1.53.3", features = ["net", "io-util", "time", "macros"] }

[target.'cfg(windows)'.dependencies]
conductor-clipboard = { path = "../../crates/clipboard" }
conductor-tailnet = { path = "../../crates/tailnet" }
tauri-plugin-single-instance = "2.5.4"
