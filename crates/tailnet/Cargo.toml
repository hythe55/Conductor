[package]
name = "conductor-tailnet"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
conductor-proto = { version = "0.1.0", path = "../proto" }
futures = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["process", "net", "time", "io-util", "macros", "rt"] }
tracing = "0.1.44"
