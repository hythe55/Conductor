[package]
name = "conductor-host"
version.workspace = true
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
conductor-clipboard = { path = "../clipboard" }
conductor-proto = { version = "0.1.0", path = "../proto" }
conductor-tailnet = { version = "0.1.0", path = "../tailnet" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
str0m = { version = "0.24.1", default-features = false, features = ["wincrypto"] }
tokio = { version = "1.53.3", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
windows-service = "0.8.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_Graphics_Dwm", "Win32_Media_MediaFoundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com_StructuredStorage", "Win32_System_Com", "Win32_System_Variant", "Win32_System_Ole", "Win32_Devices_Display", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Pointer", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Power", "Win32_System_StationsAndDesktops", "Win32_Security", "Win32_Security_Authorization", "Win32_System_RemoteDesktop", "Win32_System_JobObjects", "Win32_System_Environment", "Win32_System_LibraryLoader", "Win32_Networking_WinHttp", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Dns", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_Shutdown", "Win32_System_WindowsProgramming", "Win32_System_Pipes", "Win32_System_IO"] }
minisign-verify = "0.3.0"
opus = "0.4.0"
