name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Web client
        working-directory: app
        run: |
          npm ci
          npm run check
          npm run build
      # The app bundles the release host binary, so build that before anything else.
      - name: Host
        run: cargo build --release -p conductor-host
      - name: Tests
        run: cargo test --workspace
      # Deterministic simulated bandwidth traces; not an unreliable FPS
      # benchmark on an oversubscribed virtual GitHub runner.
      - name: Streaming regression tests (release)
        run: cargo test --release -p conductor-host quality::tests
      - name: Package Windows desktop
        working-directory: app
        run: npx tauri build --ci --bundles nsis

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install
        working-directory: app
        run: npm ci
      # Unsigned; only releases are signed.
      - name: Build
        working-directory: app
        run: NDK_HOME="$ANDROID_NDK_LATEST_HOME" npx tauri android build --apk --target aarch64 --ci
